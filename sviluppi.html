<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smontiamo i solidi – I Solidi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/presentation/style.css" />
    <script type="module" src="/src/entries/nets.ts"></script>
  </head>
  <body class="section">
    <header class="topbar">
      <a class="back" href="./index.html">⌂ Home</a>
      <h1><img class="logo" src="/favicon.svg" alt="" />Smontiamo i solidi</h1>
    </header>
    <nav class="picker" id="picker" aria-label="Scegli il solido"></nav>
    <main class="stage">
      <div class="viewport" id="viewport">
        <div class="corner">
          <button class="corner-btn" id="resetView">🎯 Vista 3D</button>
          <button class="corner-btn" id="topView">⬇ Dall’alto</button>
        </div>
        <p class="hint">Trascina per girare la vista · rotellina o due dita per lo zoom</p>
      </div>
      <aside class="panel">
        <h2 id="solidName"></h2>
        <p id="solidText"></p>
        <div class="message" id="message"></div>
        <dl class="info" id="info"></dl>
        <label class="toggle"><input type="checkbox" id="stepToggle" checked /> Una faccia alla volta</label>
      </aside>
    </main>
    <footer class="timeline" id="timeline"></footer>
  </body>
</html>
